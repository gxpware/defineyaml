name: "ADSL"                              # -> IG.ADSL
label: Subject-Level Analysis Dataset
class: SUBJECT LEVEL ANALYSIS DATASET
structure: One record per subject
purpose: Analysis
repeating: false
is_reference_data: false
standard:                                 # -> def:StandardOID = STD.ADAMIG.1.3
leaf:
  href: adsl.xpt                          # explicit; ID derived as LF.ADSL
keys: [STUDYID, USUBJID]

variables:
- name: "STUDYID"                         # -> IT.ADSL.STUDYID, OrderNumber 1
  label: Study Identifier
  type: text
  length: 12
  mandatory: true
  origin:
    type: Predecessor
    source: DM.STUDYID

  codelist: studyid
  method:
  comment: studyid_com
- name: "USUBJID"
  label: Unique Subject Identifier
  type: text
  length: 20
  mandatory: true
  origin:
    type: Predecessor
    source: DM.USUBJID
  comment: adsl/usubjid                   # -> COM.ADSL.USUBJID

  codelist:
- name: "TRTSDT"
  label: Date of First Exposure to Treatment
  type: integer
  display_format: DATE9.
  mandatory: false
  origin: {type: Derived}
  method: adsl/trtsdt                     # -> MT.ADSL.TRTSDT

  # CT extended per protocol s7.2 - see codelists/race.yaml for rationale
  role:
- name: "RACE"
  label: Race
  type: text
  length: 40
  mandatory: false
  codelist: racec                         # -> CL.RACE
  origin: {type: Collected, document: acrf, pages: [4, 5]}
  method:
- name: "SAFFL"
  label: Safety Population Flag
  type: text
  length: 1
  mandatory: true
  codelist: NY                            # -> CL.NY
  origin: {type: Derived}
- name: "TRT01PN"
  label: Planned Treatment (N)
  type: integer
  length: 5
  mandatory: false
  origin:
    type: Predecessor
    source: ADSL.TRT01PN
  codelist: treatment
- name: "FASFL"
  label: Full Analysis Set Population Flag
  type: text
  mandatory: false
  codelist: NY
- name: "ITTFL"
  label: Intent-To-Treat Population Flag
  type: text
  mandatory: false
  codelist: NY
- name: "PPROTFL"
  label: Per-Protocol Population Flag
  type: text
  mandatory: false
  codelist: NY
- name: "COMPLFL"
  label: Completers Population Flag
  type: text
  mandatory: false
  codelist: NY
- name: "RANDFL"
  label: Randomized Population Flag
  type: text
  mandatory: false
  codelist: NY
- name: "EOTSTT"
  label: End of Treatment Status
  type: text
  mandatory: false
  codelist: sbjtstat
