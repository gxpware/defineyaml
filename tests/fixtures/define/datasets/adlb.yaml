name: "ADLB"                              # -> IG.ADLB
label: Analysis Dataset Laboratory
class: BASIC DATA STRUCTURE
structure: One record per subject per parameter per analysis visit
purpose: Analysis
repeating: true
is_reference_data: false
standard:                                 # -> def:StandardOID = STD.ADAMIG.1.3
leaf:
  href: adlb.xpt
keys: [STUDYID, USUBJID, PARAMCD, AVISITN]

variables:
- name: "STUDYID"
  label: Study Identifier
  type: text
  length: 12
  mandatory: true
  origin:
    type: Predecessor
    source: LB.STUDYID

- name: "USUBJID"
  label: Unique Subject Identifier
  type: text
  length: 20
  mandatory: true
  origin:
    type: Predecessor
    source: LB.USUBJID

- name: "PARAMCD"
  label: Parameter Code
  type: text
  length: 8
  mandatory: true
  origin: {type: Assigned}
- name: "PARAM"
  label: Parameter
  type: text
  length: 100
  mandatory: true
  origin: {type: Assigned}
- name: "AVISIT"
  label: Analysis Visit
  type: text
  length: 16
  mandatory: false
  origin: {type: Derived}
- name: "AVISITN"
  label: Analysis Visit (N)
  type: integer
  length: 5
  mandatory: false
  origin: {type: Derived}
- name: "ADT"
  label: Analysis Date
  type: integer
  display_format: DATE9.
  mandatory: false
  origin: {type: Predecessor, source: LB.LBDTC, document: null}
  comment:
- name: "AVAL"
  label: Analysis Value
  type: float
  mandatory: false
  valuelist: aval                         # -> VL.ADLB.AVAL
  origin: {type: Derived}
  comment:
- name: "BASE"
  label: Baseline Value
  type: float
  mandatory: false
  origin: {type: Derived}
- name: "CHG"
  label: Change from Baseline
  type: float
  mandatory: false
  origin: {type: Derived}
- name: "TRTPN"
  label: Planned Treatment (N)
  type: integer
  length: 5
  mandatory: false
  origin: {type: Predecessor, source: ADSL.TRT01PN}
  codelist:
